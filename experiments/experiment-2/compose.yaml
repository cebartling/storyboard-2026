# MongoDB for experiment-2.
#
# ## Why 7 and not 8
#
# MongoDB 8 hard-refuses to start on any kernel >= 6.19, and this machine's is
# past that:
#
#   "MongoDB cannot start: Linux kernel versions 6.19 and newer has a known
#    incompatibility with this version of MongoDB."
#   https://jira.mongodb.org/browse/SERVER-121912   (tcmalloc / glibc rseq)
#
# A container shares the host kernel, so what matters is the kernel Docker runs
# on — not Docker Desktop specifically, which an earlier version of this note
# blamed. Re-verified 2026-09-29 on native Linux Docker (engine 29.8.1, kernel
# 7.0.0-31-generic, x86_64, AVX2 present):
#
#   mongo:8.0.32   8.0 LTS         refuses — even `mongod --version` does
#   mongo:8.3.11   current 8.3     refuses
#   mongo:8.2.12   8.2, end of life  starts, and soaks clean
#
# 8.2 is not the escape hatch it looks like, which is why it is not pinned here.
# SERVER-121912 puts the defect in 8.0+, and it is resolved "Gone away" with no
# fix version; the 8.2 branch is an end-of-life rapid release that never picked
# up the startup check. Starting is the check's absence, not the defect's.
#
# Also tried, and still true: bypassing the entrypoint to set `GLIBC_TUNABLES=
# glibc.pthread.rseq=0` does not help. The check is compiled into `mongod`, not
# into any wrapper, and SERVER-121885 reports crashes with that tunable set
# anyway.
#
# Nothing this experiment needs is 8-only — replica sets, multi-document
# transactions, partial unique indexes and findOneAndUpdate are all in 7. So the
# version is pinned here, in one place: when MongoDB ships a supported 8.x that
# starts on a 6.19+ kernel, this is a one-line change.
#
# ## Why a replica set
#
# Not a preference. MongoDB only offers multi-document transactions on a replica
# set, and this app needs exactly one — creating a map and its owner membership
# row together, so there is never an instant where a map exists that nobody can
# reach. A standalone mongod answers that transaction with "Transaction numbers
# are only allowed on a replica set member", which is a confusing way to find
# this out.
services:
  mongo:
    image: mongo:7
    container_name: storyboard-experiment-2-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiate the replica set on first start, then report healthy only once
      # this node has actually become PRIMARY. Waiting for the port to open is
      # not enough: a member that has not finished electing itself rejects
      # writes, and that failure surfaces later looking like something else.
      test: |
        mongosh --quiet --eval '
          try { rs.status() } catch (e) {
            if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }
          }
          rs.status().myState === 1 || quit(1)
        '
      interval: 2s
      timeout: 10s
      # Generous: a first run has to pull the image and elect a primary.
      retries: 30
      start_period: 5s

volumes:
  mongo-data:
